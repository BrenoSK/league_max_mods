name: Build LEAGUE MAX Mods APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q project.zip -d project
          test -f project/league_max_mods/app/build.gradle

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project/league_max_mods
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -s project/league_max_mods/app/build/outputs/apk/debug/app-debug.apk
          ls -lh project/league_max_mods/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: LEAGUE-MAX-Mods-APK
          path: project/league_max_mods/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

