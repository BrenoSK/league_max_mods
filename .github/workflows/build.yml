name: Build LEAGUE MAX Mods APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/league-max-source"

          if [[ -f "$GITHUB_WORKSPACE/settings.gradle" && -f "$GITHUB_WORKSPACE/app/build.gradle" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname 'LEAGUE_MAX_Mods_Android_v1.1.zip' -print -quit)"
            if [[ -z "$ZIP_FILE" ]]; then
              ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print -quit)"
            fi
            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: Nenhum ZIP do projeto na raiz do repositório."
              exit 1
            fi
            echo "Extraindo: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/league-max-source"
            SETTINGS_FILE="$(find "$RUNNER_TEMP/league-max-source" -type f -name settings.gradle -print -quit)"
            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "ERROR: settings.gradle não encontrado no ZIP."
              find "$RUNNER_TEMP/league-max-source" -maxdepth 5 -type f -print
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          test -f "$PROJECT_DIR/app/build.gradle" || { echo "ERROR: app/build.gradle ausente em $PROJECT_DIR"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          java-package: jdk

      - name: Use Android SDK preinstalled on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          echo "ANDROID_HOME=$SDK"
          if [[ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]]; then
            echo "ERROR: sdkmanager não existe no SDK pré-instalado. Conteúdo de cmdline-tools:"
            ls -la "$SDK/cmdline-tools" || true
            echo "Diretórios SDK disponíveis:"
            ls -la /usr/local/lib/android || true
            exit 1
          fi
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept licenses and install Android packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/LEAGUE-MAX-Mods-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/output/LEAGUE-MAX-Mods-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEAGUE-MAX-Mods-APK
          path: output/LEAGUE-MAX-Mods-debug.apk
          if-no-files-found: error
          retention-days: 7
