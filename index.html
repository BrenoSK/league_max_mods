<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Pagamento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Ou pague com cartão</h2>
        <form id="paymentForm">
            <div class="input-group">
                <label for="cardNumber">Número do cartão</label>
                <input type="text" id="cardNumber" placeholder="xxxx xxxx xxxx xxxx" maxlength="19" required>
            </div>

            <div class="input-group">
                <label for="cardName">Nome do titular</label>
                <input type="text" id="cardName" placeholder="Nome do titular do cartão" required>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="expiryDate">Data de expiração</label>
                    <input type="text" id="expiryDate" placeholder="MM/YY" maxlength="5" required>
                </div>

                <div class="input-group">
                    <label for="cvv">Código de segurança</label>
                    <input type="text" id="cvv" placeholder="CVV" maxlength="3" required>
                </div>
            </div>

            <button type="button" id="saveButton">Cadastrar Agora</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
